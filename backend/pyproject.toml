[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webscope"
version = "1.0.0"
description = "Evidence-driven local web application security workstation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "dnspython>=2.7,<3",
  "cryptography>=44,<49", "reportlab>=4.3,<5", "pillow>=11,<13"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pypdf>=5,<7", "ruff>=0.11,<1",
  "PyYAML>=6,<7", "jsonschema>=4.23,<5"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
